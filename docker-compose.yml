version: '3.8'

services:
  # Database service
  db:
    image: sqlite:latest
    container_name: imikino-db
    volumes:
      - ./data:/data
    environment:
      - SQLITE_DATABASE=imikino.db
    networks:
      - imikino-network

  # Backend service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imikino-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///data/imikino.db
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - DEBUG=${DEBUG}
      - LOG_LEVEL=${LOG_LEVEL}
      - CORS_ORIGINS=${CORS_ORIGINS}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - db
    networks:
      - imikino-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend service (for development)
  frontend:
    image: node:18-alpine
    container_name: imikino-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME}
      - NEXT_PUBLIC_APP_VERSION=${NEXT_PUBLIC_APP_VERSION}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev
    networks:
      - imikino-network
    restart: unless-stopped
    profiles:
      - development

  # Nginx reverse proxy (for production)
  nginx:
    image: nginx:alpine
    container_name: imikino-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./data/static:/var/www/static
    depends_on:
      - backend
    networks:
      - imikino-network
    restart: unless-stopped
    profiles:
      - production

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: imikino-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - imikino-network
    restart: unless-stopped
    profiles:
      - production
      - development

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: imikino-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - imikino-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana for monitoring (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: imikino-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    networks:
      - imikino-network
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  imikino-network:
    driver: bridge
