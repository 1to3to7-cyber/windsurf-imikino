[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    auth: marks tests as authentication related
    posts: marks tests as posts related
    courses: marks tests as courses related
    tasks: marks tests as tasks related
    email: marks tests as email related
    admin: marks tests as admin related
    security: marks tests as security related
    validation: marks tests as validation related
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
